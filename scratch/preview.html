<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeDeck Setup Preview</title>
  <style>
    :root {
      /* Colors */
      --primary-color: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --bg-page: #F4F5F7;
      --bg-card: #FFFFFF;
      --bg-input: #F9FAFB;
      --bg-input-focus: #FFFFFF;
      --color-success: #10B981;
      --color-success-bg: #ECFDF5;
      --color-error: #EF4444;
      --color-error-bg: #FEF2F2;
      --color-error-border: #FCA5A5;
      --color-info: #3B82F6;
      --color-info-bg: #EFF6FF;
      --color-info-border: #BFDBFE;
      --text-primary: #1F2937;
      --text-secondary: #4B5563;
      --text-tertiary: #9CA3AF;
      --text-on-primary: #FFFFFF;
      /* Radius & Spacing */
      --radius-card: 16px;
      --radius-input: 8px;
      --radius-badge: 6px;
      --border-color: #E5E7EB;
      --border-color-focus: #4F46E5;
      --border-width: 1px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      /* Shadows & Transitions */
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02), 0 16px 24px -4px rgba(0, 0, 0, 0.04);
      --shadow-focus: 0 0 0 3px rgba(79, 70, 229, 0.15);
      --transition-fast: 0.15s ease;
      --primary-color-rgb: 79, 70, 229;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding: var(--space-xl) var(--space-md);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius-card);
      padding: var(--space-lg);
      box-shadow: var(--shadow-card);
      border: var(--border-width) solid var(--border-color);
    }
    .header-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      color: var(--primary-color);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .ap-status {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-xs);
    }
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-badge);
      text-transform: uppercase;
    }
    .badge-success {
      background-color: var(--color-success-bg);
      color: var(--color-success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .ap-info {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .callout {
      padding: var(--space-md);
      border-radius: var(--radius-input);
      display: flex;
      gap: var(--space-sm);
      align-items: flex-start;
    }
    .callout-error {
      background-color: var(--color-error-bg);
      border: var(--border-width) solid var(--color-error-border);
      color: var(--color-error);
    }
    .callout-info {
      background-color: var(--color-info-bg);
      border: var(--border-width) solid var(--color-info-border);
      color: var(--color-info);
    }
    .callout-icon {
      flex-shrink: 0;
      margin-top: 2px;
    }
    .callout p {
      font-size: 13px;
      line-height: 1.5;
    }
    .callout-info p {
      color: var(--text-secondary);
    }
    .callout-error p {
      font-weight: 500;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--text-primary);
    }
    .section-icon {
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }
    .wifi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: var(--space-sm);
    }
    .wifi-pill {
      border: var(--border-width) solid var(--border-color);
      background-color: var(--bg-card);
      border-radius: var(--radius-badge);
      padding: var(--space-sm) var(--space-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
      transition: all var(--transition-fast);
      color: var(--text-secondary);
    }
    .wifi-pill:hover {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
      color: var(--primary-color);
    }
    .wifi-pill.active {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
      color: var(--primary-color);
      box-shadow: var(--shadow-focus);
    }
    .wifi-meta {
      font-size: 11px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wifi-pill:hover .wifi-meta, .wifi-pill.active .wifi-meta {
      color: var(--primary-color);
    }
    /* Custom pure CSS Signal Icon */
    .sig-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      width: 14px;
      height: 10px;
      flex-shrink: 0;
    }
    .sig-bars .sig-bar {
      width: 2px;
      background-color: var(--bg-disabled);
      border-radius: 1px;
      transition: background-color var(--transition-fast);
    }
    .sig-bars .sig-bar:nth-child(1) { height: 25%; }
    .sig-bars .sig-bar:nth-child(2) { height: 50%; }
    .sig-bars .sig-bar:nth-child(3) { height: 75%; }
    .sig-bars .sig-bar:nth-child(4) { height: 100%; }
    .wifi-pill:hover .sig-bar, .wifi-pill.active .sig-bar {
      background-color: var(--primary-color);
    }
    .wifi-pill[data-sig="good"] .sig-bar {
      background-color: var(--color-success);
    }
    .wifi-pill[data-sig="mid"] .sig-bar:nth-child(1),
    .wifi-pill[data-sig="mid"] .sig-bar:nth-child(2),
    .wifi-pill[data-sig="mid"] .sig-bar:nth-child(3) {
      background-color: #F59E0B;
    }
    .wifi-pill[data-sig="weak"] .sig-bar:nth-child(1) {
      background-color: var(--color-error);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .form-group {
      margin-bottom: var(--space-md);
    }
    .form-group.checkbox-group {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      cursor: pointer;
      user-select: none;
      margin-top: var(--space-md);
    }
    .form-group.checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      margin-top: 0;
      cursor: pointer;
    }
    .form-group.checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
    }
    .form-group input:not([type="checkbox"]), .form-group select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 100%;
      min-width: 0;
      padding: 10px 14px;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-input);
      font-size: 14px;
      background-color: #ffffff;
      color: var(--text-primary);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
    }
    .form-group select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%234B5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 36px;
    }
    ::placeholder { color: var(--text-muted); opacity: 0.8; font-size: 12px; }
    input[type="datetime-local"] { min-height: 38px; }
    .form-group input:not([type="checkbox"]):focus, .form-group select:focus {
      border-color: var(--border-color-focus);
      box-shadow: var(--shadow-focus);
    }
    .form-group input:disabled, .form-group select:disabled {
      background-color: var(--bg-disabled);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }
    .btn-submit {
      background-color: var(--primary-color);
      color: var(--text-on-primary);
      font-size: 15px;
      font-weight: 600;
      padding: var(--space-md);
      border: none;
      border-radius: var(--radius-input);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 6px -1px rgba(var(--primary-color-rgb), 0.2);
      width: 100%;
      margin-top: 16px;
      margin-bottom: 24px;
    }
    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 12px -2px rgba(var(--primary-color-rgb), 0.3);
    }
    .btn-submit:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn-submit:disabled {
      background-color: var(--text-tertiary);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* OSM Flash Animation */
    @keyframes flash-green {
      0% { background-color: var(--color-success-bg); border-color: var(--color-success); }
      100% { background-color: var(--bg-input-focus); border-color: var(--border-color-focus); }
    }
    .highlight-flash {
      animation: flash-green 0.8s ease-out;
    }

    /* Responsive Rules */
    @media (max-width: 640px) {
      body { padding: 16px 12px; }
      .card { padding: 16px; border-radius: 12px; }
      .banner { padding: 16px; border-radius: 12px; }
      .banner-title { font-size: 18px; }
      .wifi-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .wifi-pill { padding: 6px 10px; font-size: 12px; }
      .form-group input:not([type="checkbox"]), .form-group select {
        font-size: 13px;
        max-width: 100%;
      }
      .btn-submit {
        padding: 14px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="card header-card">
      <div class="logo-area">
        <svg class="logo-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <h1>HomeDeck Setup</h1>
      </div>
      <div class="ap-status">
        <span class="badge badge-success">AP 运行中</span>
        <span class="ap-info">热点: <strong>HomeDeck-ABCD</strong> / 192.168.4.1</span>
      </div>
    </header>

    <div id="error_container" class="callout callout-error" style="display:none;">
      <svg class="callout-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <p id="error_msg" class="msg"></p>
    </div>

    <section class="card">
      <h2>
        <svg class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a9 9 0 0112.14 0M1.93 9.143a13 13 0 0118.14 0" />
        </svg>
        可用 Wi-Fi 列表
      </h2>
      <div class="wifi-grid">
        <!-- WIFI_GRID_ITEMS_TEMPLATE_START -->
        <button type="button" class="wifi-pill" data-ssid="SmartHome_5G" data-sig="good">
          <span>SmartHome_5G</span>
          <div class="wifi-meta">
            <div class="sig-bars"><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span></div>
            -45 dBm
          </div>
        </button>
        <button type="button" class="wifi-pill" data-ssid="Office-Guest" data-sig="mid">
          <span>Office-Guest</span>
          <div class="wifi-meta">
            <div class="sig-bars"><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span></div>
            -68 dBm
          </div>
        </button>
        <button type="button" class="wifi-pill" data-ssid="TP-LINK_Old" data-sig="weak">
          <span>TP-LINK_Old</span>
          <div class="wifi-meta">
            <div class="sig-bars"><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span><span class="sig-bar"></span></div>
            -82 dBm
          </div>
        </button>
        <!-- WIFI_GRID_ITEMS_TEMPLATE_END -->
      </div>
    </section>

    <form id="setup_form" method="post" action="/save">
      <section class="card">
        <h2>
          <svg class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
          网络与系统配置
        </h2>
        <div class="form-group">
          <label for="wifi_ssid">Wi-Fi SSID</label>
          <input id="wifi_ssid" name="wifi_ssid" value="" placeholder="请输入 SSID 或从上方选择">
        </div>
        <div class="form-group">
          <label for="wifi_password">Wi-Fi 密码</label>
          <input id="wifi_password" name="wifi_password" type="password" value="" placeholder="请输入无线密码">
          <div class="form-group checkbox-group" style="margin-top:8px;">
            <input type="checkbox" id="show_password">
            <label for="show_password" style="margin-bottom:0;cursor:pointer;">显示密码</label>
          </div>
        </div>
        <div class="form-group">
          <label for="timezone">时区</label>
          <select id="timezone" name="timezone">
            <!-- TIMEZONE_OPTION_ITEMS_TEMPLATE_START -->
            <option value="Asia/Shanghai">Asia/Shanghai (上海)</option>
            <option value="Asia/Tokyo">Asia/Tokyo (东京)</option>
            <option value="America/New_York">America/New_York (纽约)</option>
            <!-- TIMEZONE_OPTION_ITEMS_TEMPLATE_END -->
          </select>
        </div>
        <div class="form-group checkbox-group">
          <input id="auto_rtc" name="auto_rtc" type="checkbox" value="1" disabled>
          <label for="auto_rtc">自动纠正 RTC</label>
        </div>
        <div class="form-group">
          <label for="ntp_server">NTP 服务器</label>
          <input id="ntp_server" name="ntp_server" value="ntp.aliyun.com">
        </div>
        <div class="form-group">
          <label for="manual_datetime">手动日期时间</label>
          <input id="manual_datetime" name="manual_datetime" type="datetime-local">
        </div>
      </section>

      <section class="card">
        <h2>
          <svg class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          地理位置坐标
        </h2>
        <div class="form-group">
          <label for="latitude">纬度</label>
          <input id="latitude" name="latitude" value="" placeholder="例如: 31.2304">
        </div>
        <div class="form-group">
          <label for="longitude">经度</label>
          <input id="longitude" name="longitude" value="" placeholder="例如: 121.4737">
        </div>
        <div class="form-group">
          <label for="osm_link">OpenStreetMap 地图链接</label>
          <input id="osm_link" type="url" placeholder="在此粘贴 OpenStreetMap 链接以提取坐标">
        </div>
        <div class="callout callout-info hint">
          <svg class="callout-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <p class="hint">打开 openstreetmap.org，定位当前位置并复制浏览器地址栏的链接粘贴至上方，可自动提取经纬度。</p>
        </div>
      </section>

      <button type="submit" id="submit_btn" class="btn-submit">保存配置</button>
    </form>
  </div>

  <script>
    const ssidInput = document.getElementById('wifi_ssid');
    const autoRtc = document.getElementById('auto_rtc');
    const latInput = document.getElementById('latitude');
    const lonInput = document.getElementById('longitude');
    const osmInput = document.getElementById('osm_link');
    const errCallout = document.getElementById('error_container');
    const errMsg = document.getElementById('error_msg');
    const submitBtn = document.getElementById('submit_btn');
    const setupForm = document.getElementById('setup_form');
    const wifiPills = document.querySelectorAll('.wifi-pill');
    const manualDatetime = document.getElementById('manual_datetime');
    const wifiPassword = document.getElementById('wifi_password');
    const showPassword = document.getElementById('show_password');

    function syncRtcState() {
      autoRtc.disabled = ssidInput.value.trim() === '';
      if (autoRtc.disabled) {
        autoRtc.checked = false;
      }
      manualDatetime.disabled = autoRtc.checked && !autoRtc.disabled;
      if (manualDatetime.disabled) {
        manualDatetime.value = '';
      }
    }

    function selectWifi(pill, ssidValue) {
      wifiPills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      ssidInput.value = ssidValue;
      syncRtcState();
    }

    wifiPills.forEach(pill => {
      pill.addEventListener('click', () => selectWifi(pill, pill.dataset.ssid));
      if (pill.dataset.ssid === ssidInput.value) {
        pill.classList.add('active');
      }
    });

    ssidInput.addEventListener('input', () => {
      syncRtcState();
      wifiPills.forEach(p => {
        if (p.dataset.ssid === ssidInput.value) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
    });
    autoRtc.addEventListener('change', syncRtcState);
    showPassword.addEventListener('change', function() {
      wifiPassword.type = this.checked ? 'text' : 'password';
    });

    // OSM Link Parsing & Highlight Flash Animation (Reflow triggered)
    osmInput.addEventListener('input', function() {
      const val = this.value.trim();
      let latVal = '', lonVal = '';
      
      const hashMatch = val.match(/#map=[0-9.]+\/([0-9.-]+)\/([0-9.-]+)/);
      if (hashMatch) {
        latVal = hashMatch[1];
        lonVal = hashMatch[2];
      } else {
        const latMatch = val.match(/[?&](?:mlat|lat)=([0-9.-]+)/);
        const lonMatch = val.match(/[?&](?:mlon|lon)=([0-9.-]+)/);
        if (latMatch && lonMatch) {
          latVal = latMatch[1];
          lonVal = lonMatch[1]; // Keep backwards compatibility
        }
      }

      if (latVal && lonVal) {
        latInput.value = latVal;
        lonInput.value = lonVal;

        // Force reflow and trigger micro-animation
        latInput.classList.remove('highlight-flash');
        lonInput.classList.remove('highlight-flash');
        void latInput.offsetWidth;
        void lonInput.offsetWidth;
        latInput.classList.add('highlight-flash');
        lonInput.classList.add('highlight-flash');
        errCallout.style.display = 'none';
        errMsg.textContent = '';
      }
    });

    // Geolocation bounds validation & prevent duplicate POST requests
    setupForm.addEventListener('submit', function(e) {
      const latVal = latInput.value.trim();
      const lonVal = lonInput.value.trim();
      let error = '';

      if (!latVal) {
        error = '纬度不能为空';
      } else if (isNaN(Number(latVal))) {
        error = '纬度必须是合法的数字';
      } else if (Number(latVal) < -90 || Number(latVal) > 90) {
        error = '纬度范围必须在 -90 到 90 之间';
      } else if (!lonVal) {
        error = '经度不能为空';
      } else if (isNaN(Number(lonVal))) {
        error = '经度必须是合法的数字';
      } else if (Number(lonVal) < -180 || Number(lonVal) > 180) {
        error = '经度范围必须在 -180 到 180 之间';
      }

      if (error) {
        e.preventDefault();
        errMsg.textContent = error;
        errCallout.style.display = 'flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Debounce button clicks
      submitBtn.disabled = true;
      submitBtn.textContent = '正在保存...';
    });

    syncRtcState();
  </script>
</body>
</html>
